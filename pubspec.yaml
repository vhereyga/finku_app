name: finku_app
description: "Finku: Budget & Money Manager - Clean Architecture + Riverpod + Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  sqflite: ^2.4.1
  path: ^1.9.0
  google_mlkit_text_recognition: ^0.14.0
  image: ^4.3.0
  image_picker: ^1.1.2
  http: ^1.2.2
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - maestro/test_assets/receipt_samples.json
